# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run with `cargo deny --manifest-path bridge/Cargo.toml check`.

[advisories]
# Deny crates with security advisories or that have been yanked.
yanked = "deny"
ignore = [
	# bincode is permanently unmaintained with no safe upgrade path. It reaches
	# this repo only through the vendored herdr-compat sources, which must match
	# Herdr's own wire format, so the dependency is not ours to swap.
	"RUSTSEC-2025-0141",
]

[licenses]
# Allow only licenses that are compatible with Apache-2.0 distribution.
allow = [
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"MIT",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"0BSD",
	"ISC",
	"Unicode-3.0",
	"Zlib",
]
confidence-threshold = 0.8
# herdr-web-bridge and herdr-compat are never published to crates.io and carry
# the repository's top-level license rather than a per-crate one.
private = { ignore = true }

[bans]
# Warn about duplicate transitive dependencies and wildcard version requirements.
multiple-versions = "warn"
wildcards = "warn"

[sources]
# Only allow dependencies from crates.io by default.
unknown-registry = "deny"
unknown-git = "deny"
